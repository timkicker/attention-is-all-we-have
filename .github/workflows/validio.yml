# Validio CI: the guards, ruff and every backend test that needs no Valio data.
# Valio's files and recordings never enter git, so the tests that need them skip here.
name: validio
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd src/backend && uv sync --frozen
      - run: make guards
      - run: cd src/backend && uv run ruff check validio tests ../../scripts
      - run: cd src/backend && uv run pytest -q -rs
