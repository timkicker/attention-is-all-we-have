<rect x="1072" y="48" width="200" height="448" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1092" y="92" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Approve?</text>
<text x="1092" y="124" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="start">466375 is out of stock</text>
<text x="1092" y="140" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="start">(simulated). Order 10 × 2.5 kg</text>
<text x="1092" y="156" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="start">of 465256 Valio mozzarella-</text>
<text x="1092" y="172" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="start">fontal crumbled</text>
<text x="1092" y="188" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="start">for 180.10 €?</text>
<rect x="1092" y="380" width="160" height="32" rx="4" fill="#2f5d8a"/>
<text x="1172" y="400" fill="#f5f5f5" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle" font-weight="600">Approve</text>
<rect x="1092" y="424" width="160" height="32" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1172" y="444" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Reject</text>
<text x="1172" y="524" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">phone, /approve/O-2</text>
</svg>
