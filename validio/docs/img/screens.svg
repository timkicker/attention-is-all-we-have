<text x="1000" y="180" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="end" font-weight="600">1,010.00 €</text>
<rect x="520" y="216" width="496" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
<rect x="532" y="230" width="109.0" height="20" rx="3" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="1" fill-opacity="0.08"/>
<text x="586.5" y="244" fill="#2f5d8a" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">waiting for you</text>
<text x="664" y="244" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="start">R-2  200 bags mozzarella 466375</text>
<text x="1000" y="244" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif" text-anchor="end" font-weight="600">180.10 €</text>
<text x="520" y="312" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R-1: 464306 chosen · 462921 blocked at 2,194.00 € · 463047 low lactose, its text ignored</text>
<text x="520" y="328" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">R-2: 3 listed substitutes list milk · 473986 not deliverable · 465256 beyond the list</text>
<line x1="520" y1="440" x2="1016" y2="440" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
