<rect x="337" y="49" width="160" height="446" rx="7" fill="#2d3142" fill-opacity="0.05"/>
<rect x="348" y="66" width="138" height="28" rx="4" fill="#2f5d8a" stroke="#2f5d8a" stroke-width="1" fill-opacity="0.08"/>
<text x="360" y="84" fill="#2f5d8a" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Inbox</text>
<text x="360" y="124" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Steady Orders</text>
<text x="360" y="164" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Open Ledger</text>
<text x="520" y="84" fill="#2d3142" font-size="14" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Inbox</text>
<rect x="760" y="64" width="256" height="64" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.22"/>
<text x="776" y="84" fill="#2d3142" font-size="10" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Spend Pass M-1</text>
<text x="776" y="100" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">alone up to 1,200.00 €, cap 2,000.00 €</text>
<text x="776" y="116" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">lactose free · approvers hidden</text>
<rect x="520" y="152" width="496" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.22"/>
