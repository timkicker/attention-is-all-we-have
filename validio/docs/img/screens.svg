<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1312 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screens-title screens-desc" id="screens-root">
<title id="screens-title">Validio demo layout</title>
<desc id="screens-desc">Sketch of the demo layout: the agent's terminal pane with its tool calls, the web app inbox with R-1 ordered alone for 1,010.00 euro and R-2 waiting at 180.10 euro, and the phone page asking to approve 465256.</desc>
<defs>
      <style>#screens-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #screens-root .scroll { overflow-x: auto; }</style>
  <pattern id="screens-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
  <marker id="screens-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  <marker id="screens-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f5d8a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#screens-dots)" opacity="0.55"/>
<rect x="40" y="48" width="264" height="448" rx="8" fill="#2d3142"/>
<text x="64" y="84" fill="#f5f5f5" font-size="13" font-family="'Geist', system-ui, sans-serif" text-anchor="start" font-weight="600">Kitchen agent</text>
<text x="64" y="124" fill="#d9dce3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">&gt; search_products("lactose free milk")</text>
<text x="64" y="152" fill="#d9dce3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">&gt; request_supply(1000 litres ...)</text>
<text x="64" y="180" fill="#d9dce3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">&gt; confirm_order(R-1, 464306 x 1000)</text>
<text x="64" y="208" fill="#d9dce3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">&gt; get_order(O-1)</text>
<text x="64" y="264" fill="#d9dce3" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Order O-1 is placed.</text>
<text x="64" y="300" fill="#aab0bd" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">model: Gemini or the fake twin</text>
<text x="64" y="316" fill="#aab0bd" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">server: make demo on :8410</text>
<text x="172" y="524" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">make agent SCENE=2</text>
