<title id="architecture-title">Validio components</title>
<desc id="architecture-desc">The kitchen agent calls Validio over MCP, the Spend Pass is checked, the supply pipeline grades Valio's facts, Cedar Hard Lines decide and the order service writes to SQLite and the Open Ledger, while the reader only feeds the screen.</desc>
