<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1088 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeline-title timeline-desc" id="timeline-root">
<title id="timeline-title">Validio build timeline</title>
<desc id="timeline-desc">The overnight build with checkpoints 1 to 4 from Fri 23:30, the web app rebuild, Saturday's work, feature freeze at Sat 22:00 and submission by Sun 10:00. Make demo-check passed all five scenes at about 00:45.</desc>
<defs>
