<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // The theme before the first paint: ?theme=, then the stored choice, then light.
      (function () {
        var KEY = "validio-theme";
        var q = new URLSearchParams(location.search).get("theme");
        var mode = "light";
        try {
          mode = localStorage.getItem(KEY) || "light";
        } catch (e) {}
        var mq = matchMedia("(prefers-color-scheme: light)");
        function set() {
          var m = q || mode;
          var light = m === "system" ? mq.matches : m === "light";
          document.documentElement.dataset.theme = light ? "light" : "dark";
        }
        set();
        mq.addEventListener("change", function () {
          try {
            mode = localStorage.getItem(KEY) || "light";
          } catch (e) {}
          set();
        });
      })();
    </script>
    <title>Validio</title>
    <link rel="icon" href="%sveltekit.assets%/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B4F66" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
