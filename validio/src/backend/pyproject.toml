[project]
name = "validio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.7",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "cedarpy==4.12.2",
  "joserfc==1.8.0",
  "cryptography==50.0.2",
  "sd-jwt==0.10.4",
  "jwcrypto==1.6.1",
  "google-genai==3.3.0",
  "mcp==2.3.0",
  "psycopg[binary]==3.3.9",
]

[project.scripts]
validio-agent = "validio.agent.cli:main"

[project.optional-dependencies]
cloud = ["modal==1.6.4", "openai==3.50.0"]
# make embed: a small local embedding model (ONNX, CPU) for candidate search, see docs/ARCHITECTURE.md
semantic = ["fastembed==0.9.1"]

[dependency-groups]
dev = ["hypothesis==6.170.15", "jsonschema==4.26.0", "mutmut==3.8.1", "numpy==2.5.4", "pytest==9.2.0", "pytest-asyncio==1.5.0", "respx==0.23.1", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["validio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls the real Valio test API",
  "needs_data: needs data/catalog.db built from the Valio files",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mutmut]
# make mutate (from validio/), scripts/mutate.sh. It runs in a copy under artifacts/mutmut/.
source_paths = ["validio"]
only_mutate = [
  "validio/policy/decide.py",
  "validio/policy/mandate.py",
  "validio/audit/log.py",
  "validio/matching/rank.py",
  "validio/matching/substitute.py",
  "validio/trust/claims.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q"]
