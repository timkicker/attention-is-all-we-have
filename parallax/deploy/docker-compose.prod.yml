# The demo instance: MariaDB, the API serving web/dist, Caddy with HTTPS on DOMAIN. Secrets come from ../.env.
services:
  db:
    image: mariadb:12.3.3
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-parallax}
      MARIADB_USER: ${DB_USER:-parallax}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - parallax-db:/var/lib/mysql
      - ../db/my.cnf:/etc/mysql/conf.d/parallax.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      WARM_CACHE: "1"  # api/warm.py: the first pages of every topic are cached before a visitor asks
    volumes:
      - ../data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
volumes:
  parallax-db:
  caddy-data:
